<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude — твоя команда</title>
<meta name="description" content="Практикум для предпринимателей: 8 «сотрудников» Claude с готовыми заданиями на казахском и русском.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EF; --paper:#FFFFFF; --ink:#1E1B18; --muted:#6B635A; --line:#E7DED1;
  --accent:#D9623B; --accent-soft:#FBE6DC; --gold:#C9952B; --gold-soft:#F7EBCF;
  --free:#2F7D4F; --free-soft:#DFF1E5; --code:#2A2420; --code-ink:#F6EFE6;
  --shadow:0 1px 2px rgba(30,27,24,.06),0 6px 20px rgba(30,27,24,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171412; --paper:#221E1B; --ink:#F3ECE3; --muted:#B3A99D; --line:#3A332D;
  --accent:#F07A52; --accent-soft:#3D2419; --gold:#E2B353; --gold-soft:#3A2F17;
  --free:#6BCB8F; --free-soft:#183223; --code:#0F0D0C; --code-ink:#F6EFE6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#171412; --paper:#221E1B; --ink:#F3ECE3; --muted:#B3A99D; --line:#3A332D;
  --accent:#F07A52; --accent-soft:#3D2419; --gold:#E2B353; --gold-soft:#3A2F17;
  --free:#6BCB8F; --free-soft:#183223; --code:#0F0D0C; --code-ink:#F6EFE6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Unbounded,Inter,system-ui,sans-serif;line-height:1.15;margin:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.org{font-size:13px;color:var(--muted);font-weight:500}
.lang{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--ink);font:600 14px Inter,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{padding:28px 0 8px}
.kicker{display:inline-block;background:var(--accent);color:#fff;font:700 13px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:6px;transform:rotate(-1.5deg)}
.hero h1{font-size:clamp(32px,7.5vw,64px);font-weight:800;margin:16px 0 12px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:clamp(16px,2.4vw,19px);color:var(--muted);max-width:640px;margin:0}

/* start steps */
.start{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0 8px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.step b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px}
.step span{font-size:14.5px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0 4px;font-size:14px;color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font:700 12px Inter,sans-serif;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip.free{background:var(--free-soft);color:var(--free)}
.chip.pro{background:var(--gold-soft);color:var(--gold)}

/* org chart */
.ceo{display:flex;flex-direction:column;align-items:center;margin:34px 0 0}
.ceo .you{background:var(--ink);color:var(--bg);font:800 16px Unbounded,sans-serif;padding:12px 22px;border-radius:14px;box-shadow:var(--shadow)}
.ceo .you small{display:block;font:500 12px Inter,sans-serif;opacity:.75;text-align:center;margin-top:2px}
.ceo .stem{width:2px;height:22px;background:var(--line)}
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start;border-top:2px solid var(--line);padding-top:22px;position:relative}

/* badge cards */
.badge{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.badge::before{content:"";position:absolute;top:10px;left:50%;width:44px;height:7px;margin-left:-22px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.badge summary{list-style:none;cursor:pointer;padding:28px 18px 16px;display:grid;grid-template-columns:52px 1fr;gap:4px 14px;align-items:start}
.badge summary::-webkit-details-marker{display:none}
.icon{grid-row:span 3;width:52px;height:52px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:26px}
.role-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.badge h3{font-size:18px;font-weight:600}
.hook{font-size:15px;color:var(--ink);margin-top:2px}
.meta{grid-column:2;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.open-hint{font-size:13px;font-weight:600;color:var(--accent)}
.badge[open] .open-hint .o{display:none}
.badge:not([open]) .open-hint .c{display:none}
.body{padding:0 18px 20px;border-top:1px dashed var(--line)}
.body h4{font:700 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px}
.body ol{margin:0;padding-left:20px}
.body li{margin:4px 0;font-size:15px}
.dl{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;background:var(--accent-soft);color:var(--accent);text-decoration:none;font-weight:600;font-size:14.5px;padding:10px 14px;border-radius:10px;min-height:44px}
.prompt{position:relative;background:var(--code);color:var(--code-ink);border-radius:12px;padding:14px 14px 58px;font:14px/1.55 Inter,system-ui,sans-serif;white-space:pre-wrap;word-break:break-word}
.copy{position:absolute;right:10px;bottom:10px;border:0;background:var(--accent);color:#fff;font:700 14px Inter,sans-serif;padding:10px 16px;border-radius:10px;cursor:pointer;min-height:42px}
.copy.done{background:var(--free)}
.note{margin-top:12px;font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.note b{color:var(--ink)}
.pro-extra{margin-top:12px;font-size:14px;background:var(--gold-soft);border-radius:10px;padding:10px 12px}

/* bonus */
.bonus{margin:30px 0 0;background:var(--ink);color:var(--bg);border-radius:20px;overflow:hidden}
.bonus summary{list-style:none;cursor:pointer;padding:22px 20px;display:flex;gap:14px;align-items:center}
.bonus summary::-webkit-details-marker{display:none}
.bonus .icon{background:rgba(255,255,255,.12);grid-row:auto}
.bonus h3{font-size:19px}
.bonus .hook{color:inherit;opacity:.8}
.bonus .body{border-top:1px dashed rgba(255,255,255,.2)}
.bonus .body h4{color:inherit;opacity:.7}
.bonus .dl{background:var(--accent);color:#fff}
.bonus .note{background:rgba(255,255,255,.08);color:inherit}
.bonus .note b{color:inherit}

footer{margin:34px 0 40px;font-size:14px;color:var(--muted)}
.warn{background:var(--accent-soft);border-radius:12px;padding:14px 16px;color:var(--ink);margin-bottom:16px}

@media (max-width:720px){
  .start{grid-template-columns:1fr}
  .team{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="org" data-t="org"></div>
    <div class="lang" role="group" aria-label="Язык / Тіл">
      <button type="button" data-lang="kz" aria-pressed="false">Қазақша</button>
      <button type="button" data-lang="ru" aria-pressed="true">Русский</button>
    </div>
  </div>

  <header class="hero">
    <span class="kicker" data-t="kicker"></span>
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
  </header>

  <section class="start" aria-label="start">
    <div class="step"><b>1</b><span data-t="s1"></span></div>
    <div class="step"><b>2</b><span data-t="s2"></span></div>
    <div class="step"><b>3</b><span data-t="s3"></span></div>
  </section>
  <div class="legend">
    <span><span class="chip free" data-t="free"></span> <span data-t="freeTxt"></span></span>
    <span><span class="chip pro">⭐ Pro</span> <span data-t="proTxt"></span></span>
  </div>

  <div class="ceo" aria-hidden="true">
    <div class="you">👑 <span data-t="you"></span><small>CEO</small></div>
    <div class="stem"></div>
  </div>
  <main class="team" id="team"></main>

  <details class="bonus" id="bonus"></details>

  <footer>
    <div class="warn" data-t="warn"></div>
    <div data-t="foot"></div>
  </footer>
</div>

<script>
const UI = {
  ru:{
    org:"ВКУ им. С. Аманжолова · Цифровой офис",
    kicker:"Практикум для предпринимателей",
    title:"Ты — CEO.<br><em>Claude</em> — твоя команда",
    lead:"8 сотрудников, которые не уходят в отпуск. Выберите сотрудника, скопируйте готовое задание и попробуйте прямо сейчас — с телефона или компьютера.",
    s1:'Откройте <a href="https://claude.ai" target="_blank" rel="noopener">claude.ai</a> или приложение Claude',

    steps:"Как нанять", task:"Первое задание", copy:"Копировать", copied:"Скопировано ✓",

    foot:"Все компании и данные в учебных файлах вымышлены. © 2026 Цифровой офис ВКУ им. С. Аманжолова"
  },
  kz:{
    org:"С. Аманжолов атындағы ШҚУ · Цифрлық офис",
    kicker:"Кәсіпкерлерге арналған практикум",
    title:"Сен — CEO.<br><em>Claude</em> — сенің командаң",
    lead:"Демалысқа шықпайтын 8 қызметкер. Қызметкерді таңдап, дайын тапсырманы көшіріп, дәл қазір байқап көріңіз — телефоннан немесе компьютерден.",
    s1:'<a href="https://claude.ai" target="_blank" rel="noopener">claude.ai</a> сайтын немесе Claude қосымшасын ашыңыз',
    s2:"Google немесе пошта арқылы кіріңіз",
    s3:"Төмендегі қызметкерді басып, тапсырманы көшіріңіз",
    free:"🆓 Тегін", freeTxt:"тегін аккаунтта жұмыс істейді",
    proTxt:"ақылы Pro жазылымы керек",
    you:"СЕН",
    steps:"Қалай жұмысқа алу керек", task:"Алғашқы тапсырма", copy:"Көшіру", copied:"Көшірілді ✓",
    open:"Ашу", close:"Жабу", file:"Оқу файлын жүктеу",
    warn:"<b>Claude қателесуі мүмкін.</b> Сандарды, келісімшарттарды және маңызды шешімдерді адам тексереді — бухгалтер, заңгер, өзіңіз. Төлқұжат деректерін, банк деректемелерін және клиенттердің жеке деректерін жүктемеңіз.",
    foot:"Оқу файлдарындағы барлық компаниялар мен деректер ойдан шығарылған. © 2026 С. Аманжолов атындағы ШҚУ Цифрлық офисі"
  }
};

const ROLES = [
 { id:"assistant", icon:"🗓️", tier:"pro",
   ru:{ label:"Сотрудник №1", name:"Личный ассистент", hook:"Каждое утро сам присылает сводку дня",
     steps:["Подключите Gmail и Google Календарь: Настройки → Коннекторы.","В левом меню откройте «Scheduled» (Запланированные) → «New task».","Вставьте задание ниже и выберите расписание: каждый день, 08:00."],
     prompt:"Каждое утро в 8:00 подготовь мне сводку дня:\n1. Встречи из календаря на сегодня — время, с кем, о чём.\n2. Письма за последние 24 часа, на которые нужно ответить сегодня. Для каждого — одна строка: от кого и что нужно сделать.\n3. Три главных приоритета на день.\nПиши коротко, списком, на русском языке.",
     note:"<b>Фишка:</b> вы ничего не запускаете. Задание выполняется по расписанию само, а готовая сводка ждёт вас в разделе «Scheduled»." },
   kz:{ label:"№1 қызметкер", name:"Жеке ассистент", hook:"Күн сайын таңертең күн шолуын өзі жібереді",
     steps:["Gmail мен Google Күнтізбені қосыңыз: Баптаулар → Коннекторлар.","Сол жақ мәзірде «Scheduled» бөлімін ашып, «New task» басыңыз.","Төмендегі тапсырманы қойып, кестені таңдаңыз: күн сайын, 08:00."],
     prompt:"Күн сайын таңғы 8:00-де маған күннің қысқаша шолуын дайында:\n1. Бүгінгі күнтізбедегі кездесулер — уақыты, кіммен, не туралы.\n2. Соңғы 24 сағатта келген, бүгін жауап беру керек хаттар. Әрқайсысына бір жол: кімнен және не істеу керек.\n3. Күннің ең маңызды үш басымдығы.\nҚысқа, тізіммен, қазақ тілінде жаз.",
     note:"<b>Ерекшелігі:</b> сіз ештеңе іске қоспайсыз. Тапсырма кесте бойынша өзі орындалады, дайын шолу «Scheduled» бөлімінде күтіп тұрады." } },

 { id:"smm", icon:"📸", tier:"free",
   ru:{ label:"Сотрудник №2", name:"СММ-менеджер", hook:"Фото товара → подписи и хештеги на двух языках",
     steps:["Сфотографируйте свой товар, блюдо или витрину.","Прикрепите фото в чат (значок «+») и вставьте задание.","Впишите в квадратные скобки, чем занимается ваш бизнес."],
     prompt:"Ты — СММ-менеджер моего бизнеса: [чем занимаетесь, город].\nПо фото товара:\n1. Напиши 3 варианта подписи для Instagram: продающий, с историей, с юмором. Каждый — до 60 слов.\n2. Каждый вариант дай на казахском и на русском. Казахский — живой, не дословный перевод.\n3. Добавь 10 хештегов: 5 на казахском, 5 на русском.\n4. Предложи идею для сторис с опросом.",

   kz:{ label:"№2 қызметкер", name:"СММ-менеджер", hook:"Тауар фотосы → екі тілде жазба мен хештегтер",
     steps:["Тауарыңызды, тағамыңызды немесе витринаңызды суретке түсіріңіз.","Фотоны чатқа тіркеңіз («+» белгісі) және тапсырманы қойыңыз.","Тік жақшаның ішіне бизнесіңіз не істейтінін жазыңыз."],
     prompt:"Сен менің бизнесімнің СММ-менеджерісің: [немен айналысамыз, қай қала].\nТауардың фотосы бойынша:\n1. Instagram-ға 3 түрлі жазба жаз: сатуға арналған, қызықты оқиғамен, әзілмен. Әрқайсысы 60 сөзден аспасын.\n2. Әр нұсқаны қазақша және орысша бер. Қазақшасы аудармадай емес, табиғи болсын.\n3. 10 хештег қос: 5 қазақша, 5 орысша.\n4. Сауалнамасы бар сторис идеясын ұсын.",

 { id:"analyst", icon:"🔎", tier:"pro",

     steps:["Под полем ввода нажмите кнопку «Research» (Исследование) — она станет синей.","Вставьте задание и впишите свою нишу и город.","Подождите 5–15 минут: придёт отчёт со ссылками на все источники."],
     prompt:"Проведи исследование рынка для моего бизнеса: [ниша] в городе [город], Казахстан.\nНужно:\n1. Основные конкуренты: 5–7 компаний, их цены, сильные и слабые стороны.\n2. Какие акции и предложения у них сейчас.\n3. Что клиенты хвалят и ругают в отзывах.\n4. 3 свободные ниши или идеи, как мне выделиться.\nСведи всё в таблицу и дай ссылки на все источники.",
     note:"<b>Фишка:</b> сделайте слежку за конкурентами еженедельной. В разделе «Scheduled» создайте задание «Каждый понедельник проверяй сайты и Instagram [список конкурентов] и пиши, что изменилось в ценах и акциях»." },
   kz:{ label:"№3 қызметкер", name:"Маркетолог-талдаушы", hook:"Нарықты зерттеп, бәсекелестерді бақылайды",
     steps:["Енгізу өрісінің астындағы «Research» батырмасын басыңыз — ол көк түске боялады.","Тапсырманы қойып, өз саласыңыз бен қалаңызды жазыңыз.","5–15 минут күтіңіз: барлық дереккөзге сілтемесі бар есеп келеді."],
     prompt:"Менің бизнесім үшін нарықты зерттеп бер: [сала], [қала], Қазақстан.\nҚажет:\n1. Негізгі бәсекелестер: 5–7 компания, олардың бағалары, күшті және әлсіз жақтары.\n2. Қазір олардың қандай акциялары мен ұсыныстары бар.\n3. Клиенттер пікірлерде нені мақтап, нені сынайды.\n4. Ерекшеленуге көмектесетін 3 бос нише немесе идея.\nБәрін кестеге жинап, барлық дереккөзге сілтеме бер.",

 { id:"accountant", icon:"🧾", tier:"free", file:"materials/cheki.jpg",

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function stepsHTML(arr){ return "<ol>"+arr.map(s=>"<li>"+s+"</li>").join("")+"</ol>"; }
function promptHTML(p,u){ return '<div class="prompt"><span class="ptext">'+esc(p)+'</span><button type="button" class="copy">'+u.copy+'</button></div>'; }
function tierChip(t,u){ return t==="pro" ? '<span class="chip pro">⭐ Pro</span>' : '<span class="chip free">'+u.free+'</span>'; }

function render(){
  const u = UI[lang];
  document.documentElement.lang = lang==="kz" ? "kk" : "ru";
  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML = u[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  document.title = lang==="kz" ? "Claude — сенің командаң" : "Claude — твоя команда";

  const openIds = new Set([...document.querySelectorAll("details[open]")].map(d=>d.id));
  document.getElementById("team").innerHTML = ROLES.map(r=>{
    const t = r[lang];
    return '<details class="badge" id="'+r.id+'"><summary>'+
      '<div class="icon" aria-hidden="true">'+r.icon+'</div>'+
      '<div class="role-label">'+t.label+'</div>'+
      '<h3>'+t.name+'</h3>'+
      '<div class="hook">'+t.hook+'</div>'+
      '<div class="meta">'+tierChip(r.tier,u)+'<span class="open-hint"><span class="o">'+u.open+' ↓</span><span class="c">'+u.close+' ↑</span></span></div>'+
      '</summary><div class="body">'+
      '<h4>'+u.steps+'</h4>'+stepsHTML(t.steps)+
      (r.file ? '<a class="dl" href="'+r.file+'" download>⬇ '+u.file+'</a>' : '')+
      '<h4>'+u.task+'</h4>'+promptHTML(t.prompt,u)+
      (t.note ? '<div class="note">'+t.note+'</div>' : '')+
      (t.extra ? '<div class="pro-extra">'+t.extra+'</div>' : '')+
      '</div></details>';
  }).join("");

  const b = BONUS[lang];
  const bonus = document.getElementById("bonus");
  bonus.innerHTML = '<summary><div class="icon" aria-hidden="true">'+BONUS.icon+'</div><div>'+
    '<div class="role-label" style="color:inherit;opacity:.7">'+b.label+'</div>'+
    '<h3>'+b.name+'</h3><div class="hook">'+b.hook+'</div></div></summary>'+
    '<div class="body"><h4>'+b.stepsTitle+'</h4>'+stepsHTML(b.steps)+
    '<a class="dl" href="'+BONUS.file+'" download>⬇ '+u.file+' (ZIP)</a>'+
    '<h4>'+b.task+'</h4>'+promptHTML(b.prompt,u)+
    '<div class="note">'+b.note+'</div></div>';

  openIds.forEach(id=>{ const d=document.getElementById(id); if(d) d.open=true; });
}

document.addEventListener("click", e=>{
  const lb = e.target.closest(".lang button");
  if (lb){ lang = lb.dataset.lang; try{ localStorage.setItem("biz-lang",lang); }catch(err){} render(); return; }
  const cb = e.target.closest(".copy");
  if (cb){
    const text = cb.parentElement.querySelector(".ptext").textContent;
    const ok = ()=>{ cb.textContent = UI[lang].copied; cb.classList.add("done"); setTimeout(()=>{ cb.textContent = UI[lang].copy; cb.classList.remove("done"); },1800); };
    const fallback = ()=>{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); ok();}catch(err){} ta.remove(); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  }
});

render();
if (location.hash){ const d=document.getElementById(location.hash.slice(1)); if(d&&d.tagName==="DETAILS"){ d.open=true; } }
</script>
</body>
</html>
